<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Card Gradient -->
    <linearGradient id="bgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>

    <!-- Deep Royal Navy Blue Gradient -->
    <linearGradient id="navyG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#0f2b6e" />
      <stop offset="100%" stop-color="#091b42" />
    </linearGradient>

    <!-- Emerald Teal Vibrant Gradient -->
    <linearGradient id="tealG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Golden Coin Metallic Gradient -->
    <linearGradient id="goldG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#fbbf24" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Card subtle 3D drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0f2b6e" flood-opacity="0.12"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.08"/>
    </filter>

    <filter id="elemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#091b42" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgG)" filter="url(#cardShadow)" />
  <rect x="18" y="18" width="476" height="476" rx="106" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />

  <g id="illustration">
    <!-- Green Dynamic Swoosh Line at Bottom of Illustration -->
    <path d="M 112 264 C 112 328, 220 348, 400 248 C 360 324, 230 342, 112 264 Z" fill="url(#tealG)" filter="url(#elemShadow)" />

    <!-- 1. The Ledger / Document Book (Back left) -->
    <g id="ledgerBook">
      <!-- Book spine & dark back cover -->
      <path d="M 124 126 C 114 126, 114 286, 124 286 L 152 286 L 152 126 Z" fill="#091b42" />
      <rect x="114" y="106" width="44" height="186" rx="20" fill="url(#navyG)" />
      
      <!-- Main Binder Frame -->
      <rect x="146" y="78" width="168" height="214" rx="28" fill="url(#navyG)" filter="url(#elemShadow)" />
      
      <!-- Inner White Document Page -->
      <rect x="168" y="106" width="124" height="160" rx="14" fill="#ffffff" />
      
      <!-- Document Text Lines (Blue ERP lines) -->
      <rect x="184" y="128" width="68" height="8" rx="4" fill="#1e3a8a" />
      <rect x="184" y="148" width="92" height="8" rx="4" fill="#1e3a8a" />
      <rect x="184" y="168" width="80" height="8" rx="4" fill="#1e3a8a" />
    </g>

    <!-- 2. Financial Growth Chart Bars (Right background) -->
    <g id="growthBars">
      <!-- Bar 1 -->
      <rect x="320" y="172" width="24" height="84" rx="8" fill="url(#tealG)" />
      <!-- Bar 2 -->
      <rect x="352" y="142" width="24" height="114" rx="8" fill="url(#tealG)" />
      <!-- Bar 3 -->
      <rect x="384" y="124" width="24" height="132" rx="8" fill="url(#tealG)" />

      <!-- Dynamic Rising Arrow -->
      <path d="M 280 170 Q 340 134, 388 88" fill="none" stroke="url(#tealG)" stroke-width="12" stroke-linecap="round" />
      <path d="M 374 76 L 404 80 L 396 110 Z" fill="#059669" />
    </g>

    <!-- 3. Gold Coins Stack (Bottom left of calculator) -->
    <g id="coinsStack" filter="url(#elemShadow)">
      <!-- Bottom Coin 3 -->
      <ellipse cx="202" cy="272" rx="38" ry="14" fill="#b45309" />
      <path d="M 164 272 C 164 286, 240 286, 240 272 L 240 282 C 240 296, 164 296, 164 282 Z" fill="url(#goldG)" />
      <ellipse cx="202" cy="282" rx="38" ry="12" fill="#f59e0b" />

      <!-- Coin 2 -->
      <ellipse cx="202" cy="250" rx="38" ry="14" fill="#b45309" />
      <path d="M 164 250 C 164 264, 240 264, 240 250 L 240 260 C 240 274, 164 274, 164 260 Z" fill="url(#goldG)" />
      <ellipse cx="202" cy="260" rx="38" ry="12" fill="#f59e0b" />

      <!-- Coin 1 (Top) -->
      <ellipse cx="202" cy="228" rx="38" ry="14" fill="#b45309" />
      <path d="M 164 228 C 164 242, 240 242, 240 228 L 240 238 C 240 252, 164 252, 164 238 Z" fill="url(#goldG)" />
      <ellipse cx="202" cy="232" rx="38" ry="13" fill="url(#goldG)" />
      <ellipse cx="202" cy="232" rx="32" ry="10" fill="#fef08a" opacity="0.6" />
    </g>

    <!-- 4. Modern Smart Calculator (Front center-right) -->
    <g id="calculator" filter="url(#elemShadow)">
      <!-- Calculator Body -->
      <rect x="244" y="174" width="138" height="152" rx="28" fill="url(#navyG)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.3" />
      
      <!-- Calculator Display Screen -->
      <rect x="260" y="192" width="106" height="34" rx="10" fill="#e2e8f0" />
      
      <!-- Keypad Buttons -->
      <!-- Row 1 -->
      <rect x="260" y="238" width="24" height="18" rx="6" fill="#ffffff" />
      <rect x="290" y="238" width="24" height="18" rx="6" fill="#ffffff" />
      <rect x="320" y="238" width="24" height="18" rx="6" fill="#ffffff" />

      <!-- Row 2 -->
      <rect x="260" y="264" width="24" height="18" rx="6" fill="#ffffff" />
      <rect x="290" y="264" width="24" height="18" rx="6" fill="#ffffff" />
      <!-- Tall Action '=' button in emerald green -->
      <rect x="324" y="264" width="28" height="42" rx="8" fill="url(#tealG)" />

      <!-- Row 3 -->
      <rect x="260" y="288" width="24" height="18" rx="6" fill="#ffffff" />
      <rect x="290" y="288" width="24" height="18" rx="6" fill="#ffffff" />
    </g>
  </g>

  <!-- 5. Iconic Arabic Typography "حساباتي" Matching The Exact Lettering & Diacritics -->
  <g id="hesabatyTitle">
    <text x="256" y="420" text-anchor="middle" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="#091b42" letter-spacing="-1">حساباتي</text>
  </g>
</svg>
