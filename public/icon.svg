<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="116" fill="none" stroke="#334155" stroke-width="6" opacity="0.6" />

  <!-- Inner shield / emblem with shadow -->
  <g filter="url(#glow)">
    <!-- Central ERP Ledger / Finance geometry -->
    <rect x="96" y="96" width="320" height="320" rx="48" fill="#1e293b" stroke="#3b82f6" stroke-width="4" stroke-opacity="0.4" />
    
    <!-- Bar charts / Financial growth -->
    <rect x="136" y="270" width="44" height="96" rx="10" fill="url(#goldGrad)" />
    <rect x="200" y="210" width="44" height="156" rx="10" fill="url(#accentGrad)" />
    <rect x="264" y="150" width="44" height="216" rx="10" fill="#3b82f6" />
    <rect x="328" y="240" width="44" height="126" rx="10" fill="#8b5cf6" />
    
    <!-- Growth trajectory line -->
    <path d="M140 250 L 220 180 L 286 130 L 350 200" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="286" cy="130" r="10" fill="#10b981" stroke="#ffffff" stroke-width="4" />

    <!-- Top Badge Symbol -->
    <circle cx="256" cy="100" r="28" fill="#0f172a" stroke="#10b981" stroke-width="4" />
    <path d="M246 100 L253 107 L268 93" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Arabic Typography / Monogram indicator -->
  <text x="256" y="458" font-family="'Cairo', sans-serif, system-ui" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="2">حساباتي ERP</text>
</svg>
